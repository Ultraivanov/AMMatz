<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Isometric blueprint outline of AMMatz powder production equipment</title>
  <desc id="desc">White contour SVG schematic of an industrial additive manufacturing metal powder production system with main enclosure, auxiliary unit, rear unit, operator console, fans, panels, and process fittings.</desc>
  <defs>
    <style>
      .primary {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .secondary {
        stroke: #ffffff;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.72;
        vector-effect: non-scaling-stroke;
      }
      .fine {
        stroke: #ffffff;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.46;
        vector-effect: non-scaling-stroke;
      }
      .ghost {
        stroke: #ffffff;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.24;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

